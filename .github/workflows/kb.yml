name: Keyboard harness
on: push
permissions: { contents: write }
jobs:
  shots:
    strategy:
      fail-fast: false
      matrix: { runner: [macos-14, macos-15, macos-latest] }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and screenshot
        run: |
          set -x
          xcodebuild -version
          xcrun simctl list runtimes | tee runtimes.txt
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          mkdir -p Harness.app shots
          xcrun --sdk iphonesimulator swiftc -parse-as-library -target arm64-apple-ios16.0-simulator -sdk "$SDK" Sources/*.swift -o Harness.app/Harness
          cp Info.plist Harness.app/
          codesign -s - --force Harness.app || true
          for rt in $(xcrun simctl list runtimes -j | python3 -c "import json,sys;[print(r['identifier']) for r in json.load(sys.stdin)['runtimes'] if r['platform']=='iOS' and r['isAvailable']]"); do
            ver=${rt##*iOS-}
            dt=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys;t=[d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if 'iPad-Air' in d['identifier'] or 'iPad-Pro' in d['identifier']];print(t[0])")
            udid=$(xcrun simctl create "h-$ver" "$dt" "$rt") || continue
            xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b || continue
            xcrun simctl install "$udid" Harness.app && xcrun simctl launch "$udid" com.example.kbharness && sleep 8 && xcrun simctl io "$udid" screenshot "shots/${{ matrix.runner }}-ios-$ver.png"
            xcrun simctl shutdown "$udid"
            echo "::notice::shot ios $ver on ${{ matrix.runner }}"
          done
          ls shots
      - name: Commit shots
        if: always()
        run: |
          git config user.name harness; git config user.email harness@example.com
          for i in 1 2 3 4 5; do git pull --rebase -q || true; git add shots runtimes.txt 2>/dev/null; git commit -qm "shots ${{ matrix.runner }}" || exit 0; git push && exit 0; sleep $((RANDOM%10+3)); done
