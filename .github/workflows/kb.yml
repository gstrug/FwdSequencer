name: Keyboard harness
on: push
permissions: { contents: write }
jobs:
  shots:
    strategy:
      fail-fast: false
      matrix: { runner: [macos-latest], ios: ['17.5'] }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and screenshot
        run: |
          set -x
          xcodebuild -version
          xcrun simctl list devices >/dev/null; sleep 20
          for t in 1 2 3; do xcodebuild -downloadPlatform iOS -buildVersion ${{ matrix.ios }} 2>&1 | grep -v "Downloading iOS" && xcrun simctl list runtimes | grep -q "iOS ${{ matrix.ios }}" && break; echo "::warning::download attempt $t failed"; sleep 30; done
          xcrun simctl list runtimes | tee runtimes.txt
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          mkdir -p Harness.app shots
          xcrun --sdk iphonesimulator swiftc -parse-as-library -target arm64-apple-ios16.0-simulator -sdk "$SDK" Sources/*.swift -o Harness.app/Harness
          cp Info.plist Harness.app/
          codesign -s - --force Harness.app || true
          xcrun simctl list runtimes -j > rt.json
          python3 - "${{ matrix.ios }}" > pairs.txt <<'PY'
          import json,sys
          want=sys.argv[1][:2]
          for r in json.load(open('rt.json'))['runtimes']:
              if r['platform']=='iOS' and r['isAvailable'] and r['version'].startswith(want):
                  ipads=[d['identifier'] for d in r.get('supportedDeviceTypes',[]) if 'iPad' in d['identifier']]
                  if ipads: print(r['identifier'], r['version'], ipads[-1])
          PY
          cat pairs.txt
          while read rt ver dt; do
            udid=$(xcrun simctl create "h-$ver" "$dt" "$rt") || continue
            xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b || continue
            xcrun simctl install "$udid" Harness.app && xcrun simctl launch "$udid" com.example.kbharness && sleep 10 && xcrun simctl io "$udid" screenshot "shots/ios-$ver-p1.png"
            xcrun simctl terminate "$udid" com.example.kbharness; xcrun simctl launch "$udid" com.example.kbharness page2 && sleep 10 && xcrun simctl io "$udid" screenshot "shots/ios-$ver-p2.png"
            echo "::notice::shot ios $ver $dt"
          done < pairs.txt
          ls shots
      - name: Commit shots
        if: always()
        run: |
          git config user.name harness; git config user.email harness@example.com
          for i in 1 2 3 4 5; do git pull --rebase -q || true; git add shots 2>/dev/null; git commit -qm "shots ${{ matrix.runner }}" || exit 0; git push && exit 0; sleep $((RANDOM%10+3)); done
