name: Diagnostic - sampler voices
on:
  push:
    branches: ['diag/**']
jobs:
  voices:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GeneralUser GS
        run: curl -sSL -o /tmp/gu.sf2 https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser-GS.sf2 && ls -la /tmp/gu.sf2
      - name: Render
        run: |
          swiftc -O diag/SamplerVoiceTest.swift -o /tmp/voices
          set +e
          python3 diag/fix_loops.py /tmp/gu.sf2 /tmp/a.sf2 --no-start-offsets >> /tmp/out.txt
          python3 diag/one_layer.py /tmp/a.sf2 /tmp/f.sf2 >> /tmp/out.txt
          for n in 0 1 3; do
            echo "-- program $n: now / one velocity layer" >> /tmp/out.txt
            for f in a f; do /tmp/voices /tmp/$f.sf2 sweep $n 2>&1 | grep -v "^state" >> /tmp/out.txt || echo crash >> /tmp/out.txt; done
          done
          out=$(cat /tmp/out.txt)
          out="${out//'%'/'%25'}"
          out="${out//$'\n'/'%0A'}"
          echo "::notice title=Results::$out"
