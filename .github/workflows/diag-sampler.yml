name: Diagnostic - sampler voices
on:
  push:
    branches: ['diag/**']
jobs:
  voices:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GeneralUser GS
        run: curl -sSL -o /tmp/gu.sf2 https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser-GS.sf2 && ls -la /tmp/gu.sf2
      - name: Render
        run: |
          swiftc -O diag/SamplerVoiceTest.swift -o /tmp/voices
          set +e
          python3 diag/fix_loops.py /tmp/gu.sf2 /tmp/gu_fixed.sf2 --no-start-offsets >> /tmp/out.txt
          for n in $(seq 0 128); do
            /tmp/voices /tmp/gu_fixed.sf2 sweep $n >> /tmp/out.txt 2>&1 || echo "$n CRASH" >> /tmp/out.txt
          done
          out=$(cat /tmp/out.txt)
          out="${out//'%'/'%25'}"
          out="${out//$'\n'/'%0A'}"
          echo "::notice title=Results::$out"
