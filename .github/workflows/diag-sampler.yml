name: Diagnostic - sampler voices
on:
  push:
    branches: ['diag/**']
jobs:
  voices:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GeneralUser GS
        run: curl -sSL -o /tmp/gu.sf2 https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser-GS.sf2 && ls -la /tmp/gu.sf2
      - name: Render
        run: |
          swiftc -O diag/SamplerVoiceTest.swift -o /tmp/voices
          set +e
          mkdir -p /tmp/fluid && cd /tmp/fluid
          for v in 3.1-5.3 3.1-5.2 3.1-5.1; do
            curl -fsSLO "https://deb.debian.org/debian/pool/main/f/fluid-soundfont/fluid-soundfont-gm_${v}_all.deb" && break
          done
          ar x fluid-soundfont-gm_*_all.deb && tar xf data.tar.* && cd -
          f=$(find /tmp/fluid -name 'FluidR3_GM.sf2' | head -1)
          echo "FluidR3_GM.sf2 bytes: $(stat -f%z "$f")" >> /tmp/out.txt
          for n in $(seq 0 128); do
            /tmp/voices "$f" sweep $n > /tmp/r.txt 2>&1 || echo "$n CRASH" > /tmp/r.txt
            grep -v "^state" /tmp/r.txt >> /tmp/all.txt
          done
          echo "crashes: $(grep -c CRASH /tmp/all.txt)  $(grep CRASH /tmp/all.txt | tr '\n' ' ')" >> /tmp/out.txt
          echo "pianos: $(grep -E '^ *[0-3] cost' /tmp/all.txt | tr -s ' ' | tr '\n' ';')" >> /tmp/out.txt
          echo "dropouts (silent > 0 while held): $(awk '/cost/ && $5+0 > 0 {print $1"("$5")"}' /tmp/all.txt | tr '\n' ' ')" >> /tmp/out.txt
          echo "costliest 10:" >> /tmp/out.txt
          grep cost /tmp/all.txt | sort -k3 -n -r | head -10 >> /tmp/out.txt
          echo "total cost of all 129: $(awk '/cost/ {gsub("%","",$3); t+=$3} END {print t"%"}' /tmp/all.txt)" >> /tmp/out.txt
          python3 diag/fix_loops.py /tmp/gu.sf2 /tmp/a.sf2 --no-start-offsets > /dev/null
          for n in 0 1 3; do /tmp/voices /tmp/a.sf2 sweep $n 2>&1 | grep -v "^state" | sed 's/^/GeneralUser /' >> /tmp/out.txt; done
          out=$(cat /tmp/out.txt)
          out="${out//'%'/'%25'}"
          out="${out//$'\n'/'%0A'}"
          echo "::notice title=Results::$out"
