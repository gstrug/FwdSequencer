name: Diagnostic - sampler voices
on:
  push:
    branches: ['diag/**']
jobs:
  voices:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GeneralUser GS
        run: curl -sSL -o /tmp/gu.sf2 https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser-GS.sf2 && ls -la /tmp/gu.sf2
      - name: Render
        run: |
          swiftc -O diag/SamplerVoiceTest.swift -o /tmp/voices
          set +e
          for i in 0 1 2 3 4 5 6 7 8; do
            /tmp/voices /tmp/gu.sf2 $i >> /tmp/out.txt 2>&1
            code=$?
            [ $code -ne 0 ] && echo "scenario $i crashed (exit $code)" >> /tmp/out.txt
          done
          out=$(cat /tmp/out.txt)
          out="${out//'%'/'%25'}"
          out="${out//$'\n'/'%0A'}"
          echo "::notice title=Results::$out"
