name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/**']

jobs:
  core-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test deterministic core and migrations
        run: swift test

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build debug app without signing
        run: >-
          xcodebuild
          -project FwdSequencer.xcodeproj
          -scheme FwdSequencer
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build optimized app without signing
        run: >-
          xcodebuild
          -project FwdSequencer.xcodeproj
          -scheme FwdSequencer
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
