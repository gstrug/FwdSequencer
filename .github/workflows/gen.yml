name: Make example from loops
on:
  push:
    branches: ['codex/gen-example']
permissions:
  contents: write
jobs:
  make:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the example with the app's importer
        run: FWD_WRITE_EXAMPLES=1 swift test --filter LoopExampleTests
      - name: Hand it back
        run: |
          git config user.name "Graham Struwig"
          git config user.email "g.struwig@gmail.com"
          git add FwdSequencer/Resources/Example-Malecon.json
          git commit -m "Example made from the loops by the importer"
          git push
